appId: com.wandox.harness
productName: Wandox Work
copyright: Copyright © Wandox
asar: true
extraMetadata:
  version: 2.1.2
  name: wandox-harness
  author: Wandox
  repository:
    url: ''
npmRebuild: false
nodeGypRebuild: false
afterPack: ./after-pack.cjs
icon: resources/icon.png
directories:
  output: dist
files:
  - lib/main.js
  - lib/preload.js
  - package.json
  - resources/icon.png
  - '!**/node_modules/**'
# Copy `stage/` as a whole. electron-builder's createFilter always drops a
# from-root `node_modules`, so `from: stage/host` would omit the Host closure.
extraResources:
  - from: stage
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: generic
  url: https://wandox-work.oss-cn-shenzhen.aliyuncs.com/v2
mac:
  # Unsigned `dist:desktop` passes `--config.mac.identity=-`. Signed
  # `dist:mac:signed` passes the Developer ID Application identity, hardened
  # runtime, notarize, and entitlements instead.
  gatekeeperAssess: false
  hardenedRuntime: false
  category: public.app-category.developer-tools
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  # rcedit writes the Harness icon into the exe and shortcuts. Authenticode
  # still does not run: unsigned `dist:desktop` sets CSC_IDENTITY_AUTO_DISCOVERY=false.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
