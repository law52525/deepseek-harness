<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Wandox Work 应用图标：透明底 + 纯色 W，与上游 DeepSeek Harness 的形态一致
    （上游是透明底黑鲸鱼，viewBox="-5 -5 60 60"，字形约占画布 83%）。

    字形与侧栏字标同源：直接取自
    packages/client/ui-primitives/src/BrandWordmark.tsx 的第一个 path（W 标）。
    ★ 改字形时两处一起改，否则应用图标与界面里的标志会分叉。

    fill 用 #000：与上游 favicon 的 light-scheme 取值一致。
    ★ .icns 无法跟随 SVG 的 prefers-color-scheme —— 明暗表现由系统决定，
      与上游 DeepSeek Harness 的行为保持一致，本项目不额外处理。

    几何：W 的 bbox 为 x 0.409–21.56 / y 3.76–20.287（含两端圆头），
    中心 (10.98, 12.02)，宽 21.15 / 高 16.53。
    scale 40 使宽度约 846px ≈ 画布的 83%，与上游字形的占比一致。
  -->
  <g transform="translate(512 512) scale(40) translate(-10.98 -12.02)">
    <path fill="#000" d="M 0.409 5.581 L 5.602 20.287 L 10.984 11.827 L 16.367 20.287 L 21.56 5.581 A 1.47 1.47 0 0 1 18.738 4.759 L 15.977 17.373 L 10.984 8.888 L 5.992 17.373 L 3.231 4.759 A 1.47 1.47 0 0 1 0.409 5.581 Z"/>
  </g>
</svg>
